---
# ba0fde3d-bee7-4307-b97b-17d0d20aff50
name: Build image
on:
  pull_request:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:
    inputs:
      VARIANT:
        description: 'Desktop variant to build'
        required: true
        type: choice
        default: 'ALL'
        options:
          - 'gnome'
          - 'kde'
          - 'cosmic'
          - 'ALL'

  schedule:
    # run on Saturday at 10:00 UTC
    - cron: '0 10 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  set-env:
    runs-on: ubuntu-26.04
    outputs:
      LATEST_TAG: ${{ steps.set.outputs.LATEST_TAG }}
      REGISTRY: ${{ steps.set.outputs.REGISTRY }}
      REGISTRY_USER: ${{ steps.set.outputs.REGISTRY_USER }}
      PLATFORMS: ${{ steps.set.outputs.PLATFORMS }}
      IMAGE_PATH: ${{ steps.set.outputs.IMAGE_PATH }}
      IMAGE_NAME: ${{ steps.set.outputs.IMAGE_NAME }}
      IMAGE_REF: ${{ steps.set.outputs.IMAGE_REF }}
      VARIANTS: ${{ steps.set.outputs.VARIANTS }}
      MATRIX: ${{ steps.set.outputs.MATRIX }}
    steps:
      - name: Checkout github actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set environment variables
        uses: ./.github/actions/config
        id: set
        with:
          # Only manual runs can choose a variant
          VARIANT: ${{ inputs.VARIANT || 'ALL' }}

  build-test-promote:
    name: Build, Test, Promote
    needs: set-env
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.set-env.outputs.MATRIX)}}
    uses: ./.github/workflows/reusable-build.yml
    with:
      variant: ${{ matrix.variant }}
      containerfile: Dockerfile
      image_name: "${{ needs.set-env.outputs.IMAGE_NAME }}-${{ matrix.variant }}"
      previous_image: "${{ needs.set-env.outputs.IMAGE_REF }}-${{ matrix.variant }}:latest"
      latest_tag: ${{ needs.set-env.outputs.LATEST_TAG }}
      platforms: ${{ needs.set-env.outputs.PLATFORMS }}
      image_path: ${{ needs.set-env.outputs.IMAGE_PATH }}
      registry: ${{ needs.set-env.outputs.REGISTRY }}
      registry_user: ${{ needs.set-env.outputs.REGISTRY_USER }}
      KMS_KEY_ALIAS: atomicsig
      AWS_REGION: us-east-1
    secrets:
      REGISTRY_TOKEN: ${{ secrets.QUAY_PASSWORD }}
      AWS_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/atomicimages
    permissions:
      contents: read
      packages: write
      id-token: write

  create-release:
    name: Create Release
    needs: [set-env, build-test-promote]
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04

    steps:
      - name: Fetch Changelogs
        id: download-changelogs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          pattern: changelog-*
          merge-multiple: true
          path: /tmp/changelogs

      - name: Fetch SBOMs
        id: download-sbom
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          pattern: "*.spdx.json"
          merge-multiple: true
          path: /tmp/sboms

      - name: Compress SBOMs
        id: compress-sbom
        shell: bash
        run: |
          cd ${{ steps.download-sbom.outputs.download-path }}
          for f in *.spdx.json; do
            gzip -9 "$f"
          done

      - name: Prepare Release
        id: prepare-release
        env:
          VERSION: ${{ needs.build-test-promote.outputs.version }}
        shell: bash
        run: |
          if [[ ! -d ${{ steps.download-changelogs.outputs.download-path }} ]]; then
            echo "No changelogs found, skipping release creation"
            echo "skip=1" >> "$GITHUB_ENV"
            exit
          fi

          # The images in a release don't always have the same version: when a previous run only
          # published some of them, those get a higher version in this one. Name the release after
          # the highest version in the changelogs, falling back to the one from the build.
          HIGHEST=$(sed -n 's/^### Version: //p' ${{ steps.download-changelogs.outputs.download-path }}/*.txt | sort -V | tail -1)
          VERSION="${HIGHEST:-${VERSION}}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          echo "Automated release for version \`${VERSION}\`." > ./changelog.md

          for changelog in ${{ steps.download-changelogs.outputs.download-path }}/*.txt; do
            cat $changelog >> ./changelog.md
          done

      - name: Create Release
        if: ${{ env.skip != '1' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          name: "Version ${{ steps.prepare-release.outputs.version }}"
          tag_name: ${{ steps.prepare-release.outputs.version }}
          body_path: ./changelog.md
          make_latest: true
          files: "${{ steps.download-sbom.outputs.download-path }}/*.spdx.json.gz"

---
# ba0fde3d-bee7-4307-b97b-17d0d20aff50
name: Reusable Build
on:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
      containerfile:
        required: true
        type: string
      image_name:
        required: true
        type: string
      previous_image:
        required: true
        type: string
      platforms:
        required: true
        type: string
      image_path:
        required: true
        type: string
      registry:
        required: true
        type: string
      registry_user:
        required: true
        type: string
      latest_tag:
        required: false
        type: string
      KMS_KEY_ALIAS:
        required: false
        type: string
      AWS_REGION:
        required: false
        type: string
    outputs:
      version:
        value: ${{ jobs.build-image.outputs.version }}
    secrets:
      REGISTRY_TOKEN:
        required: true
      SIGNING_SECRET:
        required: false
      AWS_ROLE_ARN:
        required: false

jobs:
  check-update:
    name: Check for updates
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    outputs:
      res: ${{ steps.check-update.outputs.res }}
    steps:
      - name: Log in to registry
        shell: bash
        run: podman login ${{ inputs.registry }} -u ${{ inputs.registry_user }} -p ${{ secrets.REGISTRY_TOKEN }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Check update
        id: check-update
        env:
          PREVIOUS_IMAGE: ${{ inputs.previous_image }}
          CONTAINERFILE: ${{ inputs.containerfile }}
        shell: bash
        run: |
          # A rebuild only changes the packages that this image adds to its base image. The ones
          # that come with the base image only change when the base image does, and that triggers
          # a build of its own. So only look for updates of the packages added here: otherwise an
          # update that the base image hasn't picked up yet (or never will, like a package that is
          # also in EPEL with a higher version) starts a build that doesn't change anything.
          #
          # res:
          #   0 - no updates
          #   100 - updates available
          #   anything else - the check failed (image not found, etc.), build to be safe
          BASE_IMAGE=$(awk 'toupper($1) == "FROM" { for (i = 2; i <= NF; i++) if ($i !~ /^--/) { img = $i; break } } END { print img }' "${CONTAINERFILE}")
          echo "Base image: ${BASE_IMAGE}"

          res=0
          BASE_PACKAGES=$(podman run --quiet --rm "${BASE_IMAGE}" rpm -qa --qf '%{NAME}\n') || res=$?
          UPDATES=$(podman run --quiet --rm "${PREVIOUS_IMAGE}" dnf -q repoquery --upgrades --qf '%{name}') || res=$?

          if [[ $res -eq 0 ]]; then
            # Updates for packages that are not in the base image
            RELEVANT=$(LC_ALL=C comm -23 <(echo "${UPDATES}" | grep . | LC_ALL=C sort -u) <(echo "${BASE_PACKAGES}" | LC_ALL=C sort -u) || true)
            echo "Packages with updates:"
            echo "${UPDATES}" | grep . | LC_ALL=C sort -u | sed 's/^/  /' || true
            echo "Of those, added by this image (the rest come with the base image and are ignored):"
            echo "${RELEVANT:-(none)}" | sed 's/^/  /'
            if [[ -n "${RELEVANT}" ]]; then
              res=100
            fi
          fi

          echo "res=${res}" >> "$GITHUB_OUTPUT"
          echo "Exit code: '$res'"

  build-image:
    name: Build image
    needs: [check-update]
    if: ${{ !failure() && !cancelled() && (github.event_name != 'schedule' || needs.check-update.outputs.res != 0) }}
    uses: AlmaLinux/atomic-ci/.github/workflows/build-image.yml@v13
    with:
      containerfile: ${{ inputs.containerfile }}
      image-name: ${{ inputs.image_name }}
      previous-image: ${{ inputs.previous_image }}
      upstream-public-key: almalinux-bootc.pub
      variant: ${{ inputs.variant }}
      platforms: ${{ inputs.platforms }}
      skip-maximize-build-space: false
      image-path: ${{ inputs.image_path }}
      REGISTRY: ${{ inputs.registry }}
      REGISTRY_USER: ${{ inputs.registry_user }}
      image-description: "AlmaLinux Atomic Desktop - ${{ inputs.variant }}"
      changelog-snippet: |
        Major Components:
            - Kernel: <relver:kernel>
            - Systemd: <relver:systemd>
            - Glibc: <relver:glibc>
            - Bootc: <relver:bootc>
            - ${{ inputs.variant == 'gnome' && 'GNOME: <version:gdm>'
                || inputs.variant == 'kde' && 'KDE: <version:plasma-desktop>'
                || inputs.variant == 'cosmic' && 'COSMIC: <version:cosmic-epoch>' }}
      KMS_KEY_ALIAS: ${{ inputs.KMS_KEY_ALIAS }}
      AWS_REGION: ${{ inputs.AWS_REGION }}
      generate-sbom: true
    secrets:
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    permissions:
      contents: read
      packages: write
      id-token: write

  test-image:
    name: Test image
    needs: [check-update, build-image]
    if: ${{ !failure() && !cancelled() && needs.build-image.result == 'success' && (github.event_name != 'schedule' || needs.check-update.outputs.res != 0) }}
    runs-on: ubuntu-26.04
    env:
      IMAGE_REF: "${{ needs.build-image.outputs.image-ref }}@${{ needs.build-image.outputs.digest }}"
    steps:
      - name: Login to Container Registry
        run: echo ${{ secrets.REGISTRY_TOKEN }} | podman login -u ${{ inputs.registry_user }} --password-stdin ${{ inputs.registry }}
      - name: Test container
        run: |
          cat << 'EOF' > /tmp/test.sh
          set -ex
          cat /etc/os-release
          bootc -V
          EOF
          podman run --rm \
            -v /tmp/test.sh:/tmp/test.sh \
            ${{ env.IMAGE_REF }} \
            /bin/bash /tmp/test.sh

  promote-image:
    name: Promote image
    needs: [check-update, build-image, test-image]
    if: ${{ !failure() && !cancelled() && needs.test-image.result == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'schedule' || needs.check-update.outputs.res != 0) }}
    uses: AlmaLinux/atomic-ci/.github/workflows/retag-image.yml@v13
    with:
      image: ${{ needs.build-image.outputs.image-ref }}
      digest: ${{ needs.build-image.outputs.digest }}
      tag: |
        ${{ inputs.latest_tag }}
        ${{ needs.build-image.outputs.major-version }}
        ${{ needs.build-image.outputs.redhat-version-id }}
        ${{ needs.build-image.outputs.version }}
      REGISTRY: ${{ inputs.registry }}
      REGISTRY_USER: ${{ inputs.registry_user }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    permissions:
      packages: write
